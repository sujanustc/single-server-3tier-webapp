name: Deploy 3-Tier Application with Monitoring

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy App and Monitoring Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Package Artifacts
        run: |
          tar -czf frontend.tar.gz -C frontend/dist .
          tar -czf backend.tar.gz --exclude=node_modules --exclude=.env --exclude=logs -C backend .
          tar -czf monitoring.tar.gz monitoring
          tar -czf scripts.tar.gz scripts

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName ${{ secrets.EC2_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
          EOF

      - name: Upload Artifacts to EC2
        run: |
          scp frontend.tar.gz backend.tar.gz monitoring.tar.gz scripts.tar.gz ec2:/tmp/

      - name: Deploy Application and Monitoring
        run: |
          ssh ec2 'bash -s' <<'REMOTE'
          set -euo pipefail
          DEPLOY_DIR=/tmp/bmi-deploy
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          mv /tmp/frontend.tar.gz /tmp/backend.tar.gz /tmp/monitoring.tar.gz /tmp/scripts.tar.gz "$DEPLOY_DIR/"
          tar -xzf "$DEPLOY_DIR/monitoring.tar.gz" -C "$DEPLOY_DIR"
          tar -xzf "$DEPLOY_DIR/scripts.tar.gz" -C "$DEPLOY_DIR"
          chmod +x "$DEPLOY_DIR/scripts/"*.sh
          DEPLOY_DIR="$DEPLOY_DIR" bash "$DEPLOY_DIR/scripts/deploy-app.sh"
          DEPLOY_DIR="$DEPLOY_DIR" bash "$DEPLOY_DIR/scripts/setup-monitoring.sh"
          REMOTE

      - name: Health Checks
        run: |
          ssh ec2 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "Checking backend health..."
          curl -sf http://localhost:3000/health
          echo ""
          echo "Waiting for Grafana to start..."
          for i in {1..15}; do
            curl -sf http://localhost:3001/api/health >/dev/null && break || sleep 2
          done
          echo "Checking Grafana..."
          curl -sf http://localhost:3001/api/health
          echo ""
          echo "Checking Prometheus..."
          curl -sf http://localhost:9090/-/healthy
          echo ""
          echo "Checking Loki..."
          curl -sf http://localhost:3100/ready
          echo ""
          echo "Checking Nginx..."
          curl -sf http://localhost/ | head -c 200
          echo ""
          echo "All health checks passed."
          REMOTE
